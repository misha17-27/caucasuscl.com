---
# cPanel → Git Version Control → Deploy HEAD Commit.
#
# Repozitoriya public_html-dən KƏNARDA saxlanılır (~/repositories/...), ona görə
# `.git` qovluğu veb-dən açılmır. Bu tapşırıq fayllları public_html-ə köçürür.
#
# DİQQƏT: `--delete` İŞLƏDİLMİR. public_html-də repozitoriyada olmayan, lakin
# saytın işləməsi üçün vacib fayllar var və onlar silinməməlidir:
#   admin/config.php        — baza parolu, Turnstile və SMTP açarları
#   storage/                — jurnal faylları
#   assets/img/admin/       — paneldən yüklənmiş şəkillər
#   wp-content/uploads/     — köhnə WordPress şəkilləri (köhnə linklər sınmasın)
#
# Məqalələr `--only-new` ilə yüklənir: paneldən edilmiş redaktə hər deploy-da
# geri qaytarılmır. Fayldakı mətni zorla yazmaq lazım olsa, skript Terminaldan
# bayraqsız işə salınır.
deployment:
  tasks:
    - export DP=/home/caucasuscl/public_html
    - /usr/bin/rsync -rlptD --exclude='.git/' --exclude='.github/' --exclude='.claude/' --exclude='.gitignore' --exclude='.gitattributes' --exclude='.cpanel.yml' --exclude='README.md' --exclude='router.php' ./ $DP/
    # PHP ikiliyi: cPanel-də /usr/local/bin/php həmişə domenin seçilmiş
    # versiyası olmur, ona görə əvvəlcə ea-php74 axtarılır.
    - export PHPBIN=$(for p in /opt/cpanel/ea-php74/root/usr/bin/php /opt/cpanel/ea-php82/root/usr/bin/php /usr/local/bin/php /usr/bin/php; do [ -x "$p" ] && echo "$p" && break; done)
    # Diqqət — YAML plain skalyarında «iki nöqtə + boşluq» olmamalıdır.
    - echo "PHP ikiliyi = ${PHPBIN:-TAPILMADI} / $($PHPBIN -r 'echo PHP_VERSION;' 2>/dev/null)"
    - $PHPBIN $DP/tools/import-articles.php --only-new
